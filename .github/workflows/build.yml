name: Build

# Every push to main builds Launcher.exe.
# A release is made only when <Version> in LauncherApp.csproj has no release yet:
# bump the version (e.g. 0.3.0 -> 0.3.1) and push, and release v0.3.1 is created with Launcher.exe attached.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build LauncherApp.csproj -c Release

      - name: Upload Launcher.exe
        uses: actions/upload-artifact@v7
        with:
          name: Launcher
          path: bin/Release/net48/Launcher.exe

      - name: Check whether this version is already released
        id: version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' LauncherApp.csproj | tr -d '\r')
          if [ -z "$version" ]; then echo "No <Version> in LauncherApp.csproj"; exit 1; fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; skipping."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version has no release yet; releasing."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Launcher ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: bin/Release/net48/Launcher.exe
          generate_release_notes: true
